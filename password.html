<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back Queen Dajenne 👑</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .lock-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .lock-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    .lock-card {
      background: rgba(45, 10, 92, 0.8);
      border: 1px solid rgba(255, 45, 139, 0.4);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 0 40px rgba(255,45,139,0.2);
    }

    .pw-input {
      width: 100%;
      padding: 16px 20px;
      margin-top: 24px;
      border-radius: 50px;
      border: 2px solid rgba(255,45,139,0.5);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 3px;
      outline: none;
      font-family: 'Montserrat', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .pw-input:focus {
      border-color: var(--pink);
      box-shadow: var(--glow-pink);
    }

    .pw-input.error {
      border-color: var(--red-flag);
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .error-msg {
      color: #FF6B6B;
      font-size: 0.85rem;
      margin-top: 10px;
      display: none;
    }

    .btn-login {
      width: 100%;
      margin-top: 16px;
      justify-content: center;
    }

    .hint {
      margin-top: 20px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="lock-screen">
    <div class="lock-icon">🔐</div>
    <div class="lock-card">
      <h2 class="gradient-text">Girls only</h2>
      <p class="handwriting" style="margin-top: 8px;">Kein Arschloch erlaubt.</p>
      <p style="margin-top: 16px; color: rgba(255,255,255,0.65); font-size: 0.9rem;">
        Du weißt, was du eingeben musst. 😉
      </p>
      <input
        type="password"
        class="pw-input"
        id="pw"
        placeholder="Passwort..."
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()"
      >
      <p class="error-msg" id="err">Falsches Passwort. Nur für echte Queens! 👑</p>
      <button class="btn btn-primary btn-login" onclick="doLogin()">Rein da! 🚀</button>
      <p class="hint">Tipp vom Herz: Du bist genau richtig hier.</p>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Bereits eingeloggt? Direkt weiter
    if (sessionStorage.getItem('wbqd_auth') === 'true') {
      window.location.href = 'index.html';
    }

    function doLogin() {
      const pw = document.getElementById('pw').value;
      const input = document.getElementById('pw');
      const err = document.getElementById('err');

      if (login(pw)) {
        window.location.href = 'index.html';
      } else {
        input.classList.add('error');
        err.style.display = 'block';
        setTimeout(() => input.classList.remove('error'), 500);
        input.value = '';
        input.focus();
      }
    }
  </script>
</body>
</html>
