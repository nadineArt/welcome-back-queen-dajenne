<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💌 Liebesbriefe – WBQD</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 10px 22px;
      border-radius: 50px;
      border: 2px solid rgba(255,45,139,0.4);
      background: transparent;
      color: white;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--pink);
      border-color: var(--pink);
      box-shadow: var(--glow-pink);
    }

    /* ── Eingabe-Tab ── */
    .input-form {
      max-width: 560px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 2px solid rgba(255,45,139,0.35);
      background: rgba(255,255,255,0.06);
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      border-color: var(--pink);
      box-shadow: var(--glow-pink);
    }

    .form-input::placeholder { color: rgba(255,255,255,0.3); }

    textarea.form-input {
      resize: vertical;
      min-height: 90px;
    }

    .sentence-prefix {
      color: var(--teal);
      font-style: italic;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .submitted-list {
      max-width: 560px;
      margin: 24px auto 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .submitted-item {
      background: rgba(0,245,212,0.07);
      border: 1px solid rgba(0,245,212,0.25);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      gap: 8px;
    }

    .submitted-name { color: var(--teal); font-weight: 700; flex-shrink: 0; }
    .submitted-text { color: rgba(255,255,255,0.75); flex: 1; }

    .delete-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      transition: color 0.2s;
      flex-shrink: 0;
      min-width: 32px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .delete-btn:hover { color: var(--red-flag); }

    .list-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn-reset-all {
      background: transparent;
      border: 1px solid rgba(255,23,68,0.4);
      color: rgba(255,100,100,0.8);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Montserrat', sans-serif;
    }

    .btn-reset-all:hover {
      background: rgba(255,23,68,0.15);
      border-color: var(--red-flag);
      color: var(--red-flag);
    }

    /* Status indicator */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .status-dot.connected { background: #4CAF50; box-shadow: 0 0 6px rgba(76,175,80,0.6); }
    .status-dot.disconnected { background: #FF5252; }
    .status-dot.loading { background: var(--gold); animation: pulse-glow 1s infinite; }

    /* ── Slideshow-Tab ── */
    .slideshow-wrapper {
      max-width: 700px;
      margin: 0 auto;
    }

    .slide {
      display: none;
      text-align: center;
      animation: slide-in-up 0.6s ease forwards;
    }

    .slide.active { display: block; }

    .slide-card {
      background: linear-gradient(135deg, rgba(45,10,92,0.95), rgba(10,26,46,0.95));
      border: 2px solid rgba(255,45,139,0.4);
      border-radius: 28px;
      padding: 48px 40px;
      box-shadow: var(--glow-pink), 0 20px 60px rgba(0,0,0,0.4);
    }

    .slide-icon { font-size: 3rem; margin-bottom: 16px; }
    .slide-prefix { font-size: 0.95rem; color: rgba(255,255,255,0.5); margin-bottom: 8px; }

    .slide-satz {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      color: var(--gold);
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .slide-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: var(--teal);
    }

    .slide-controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .slide-counter {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      min-width: 60px;
      text-align: center;
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transition: background 0.3s;
      cursor: pointer;
    }
    .dot.active { background: var(--pink); }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: rgba(255,255,255,0.4);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a class="nav-logo" href="index.html">👑 WBQD</a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="red-flag.html">🚩 Red Flag</a>
        <a href="liebesbriefe.html" class="active">💌 Liebesbriefe</a>
        <a href="glow-up.html">✨ Glow-Up</a>
        <a href="wuensche.html">🌟 Wünsche</a>
      </div>
    </div>
  </nav>

  <div id="confetti-container"></div>

  <div class="page-wrapper">
    <div class="section-header">
      <span class="badge badge-pink">Spiel 02</span>
      <h1 class="mt-8 gradient-text">Liebesbriefe</h1>
      <div class="divider"></div>
      <p>Jede Freundin vervollständigt einen Satz — dann Slideshow für Dajenne.</p>
      <p style="margin-top:8px; font-size:0.8rem; color:rgba(255,255,255,0.4);">
        <span class="status-dot loading" id="statusDot"></span>
        <span id="statusText">Verbinde mit Datenbank...</span>
      </p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tabInput" onclick="showTab('input')">✍️ Satz eingeben</button>
      <button class="tab-btn" id="tabSlide" onclick="showTab('slide')">▶️ Slideshow starten</button>
    </div>

    <!-- ── Eingabe-Tab ── -->
    <div id="tabContentInput">
      <div class="input-form">
        <div class="card">
          <h3 class="text-center mb-24">Dein Liebesbrief</h3>
          <div class="form-group">
            <label>Dein Vorname</label>
            <input type="text" class="form-input" id="inputName" placeholder="z.B. Lena" maxlength="30">
          </div>
          <div class="form-group">
            <label>Vervollständige den Satz</label>
            <p class="sentence-prefix">"Du bist besser dran ohne ihn, weil..."</p>
            <textarea class="form-input" id="inputSatz" placeholder="...du jetzt wieder so viel heller strahlst." maxlength="300"></textarea>
          </div>
          <button class="btn btn-primary" id="submitBtn" style="width:100%; justify-content:center;" onclick="addBrief()">
            Absenden 💌
          </button>
        </div>
      </div>

      <div id="submittedList" class="submitted-list"></div>

      <div class="list-actions" id="listActions" style="display:none;">
        <button class="btn-reset-all" onclick="resetAll()">🗑️ Alle Einträge löschen</button>
      </div>

      <div style="text-align:center; margin-top: 24px;">
        <button class="btn btn-outline" style="font-size:0.85rem;" onclick="showTab('slide')">
          Slideshow starten ▶️
        </button>
      </div>
    </div>

    <!-- ── Slideshow-Tab ── -->
    <div id="tabContentSlide" style="display:none;">
      <div class="slideshow-wrapper">
        <div id="slideshowArea"></div>
        <div class="slide-controls">
          <button class="btn btn-outline" id="btnPrev" onclick="prevSlide()">← Zurück</button>
          <span class="slide-counter" id="slideCounter">1 / 1</span>
          <button class="btn btn-primary" id="btnNext" onclick="nextSlide()">Weiter →</button>
        </div>
        <div class="progress-dots" id="progressDots"></div>
        <div style="text-align:center; margin-top:32px;">
          <a href="glow-up.html" class="btn btn-gold">Weiter zu Glow-Up Wall ✨</a>
        </div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script type="module">
    import { db, ref, push, onValue, remove, get } from './firebase-config.js';

    checkAuth();

    const DB_PATH = 'wbqd/liebesbriefe';
    let briefe = [];
    let currentSlide = 0;
    let activeTab = 'input';

    // ── Realtime listener ──
    const briefeRef = ref(db, DB_PATH);
    onValue(briefeRef, (snapshot) => {
      briefe = [];
      if (snapshot.exists()) {
        snapshot.forEach((child) => {
          briefe.push({ id: child.key, ...child.val() });
        });
        briefe.sort((a, b) => a.timestamp - b.timestamp);
      }
      setStatus('connected', briefe.length + ' Brief' + (briefe.length !== 1 ? 'e' : '') + ' gespeichert');
      renderSubmittedList();
      if (activeTab === 'slide') renderSlideshow();
    }, (error) => {
      setStatus('disconnected', 'Keine Verbindung zur Datenbank');
    });

    setStatus('loading', 'Verbinde...');

    function setStatus(state, text) {
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot ' + state;
      document.getElementById('statusText').textContent = text;
    }

    // ── Add brief ──
    window.addBrief = async function() {
      const name = document.getElementById('inputName').value.trim();
      const satz = document.getElementById('inputSatz').value.trim();
      if (!name) { alert('Bitte deinen Namen eingeben!'); return; }
      if (!satz) { alert('Bitte deinen Satz vervollständigen!'); return; }

      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '⏳ Speichern...';
      btn.disabled = true;

      try {
        await push(ref(db, DB_PATH), { name, satz, timestamp: Date.now() });
        document.getElementById('inputName').value = '';
        document.getElementById('inputSatz').value = '';
        btn.innerHTML = '✅ Gespeichert!';
        setTimeout(() => { btn.innerHTML = 'Absenden 💌'; btn.disabled = false; }, 1500);
      } catch (e) {
        btn.innerHTML = 'Absenden 💌';
        btn.disabled = false;
        alert('Fehler beim Speichern. Bitte nochmal versuchen.');
      }
    };

    // ── Delete single ──
    window.deleteBrief = async function(id) {
      await remove(ref(db, DB_PATH + '/' + id));
    };

    // ── Reset all ──
    window.resetAll = async function() {
      if (!confirm('Wirklich ALLE Liebesbriefe löschen? Das kann nicht rückgängig gemacht werden!')) return;
      await remove(ref(db, DB_PATH));
    };

    // ── Render list ──
    function renderSubmittedList() {
      const el = document.getElementById('submittedList');
      const actions = document.getElementById('listActions');
      if (briefe.length === 0) {
        el.innerHTML = '';
        actions.style.display = 'none';
        return;
      }
      actions.style.display = 'flex';
      el.innerHTML = briefe.map(b => `
        <div class="submitted-item">
          <span class="submitted-name">${b.name}</span>
          <span class="submitted-text">...${b.satz}</span>
          <button class="delete-btn" onclick="deleteBrief('${b.id}')" title="Löschen">✕</button>
        </div>
      `).join('');
    }

    // ── Tab switching ──
    window.showTab = function(tab) {
      activeTab = tab;
      document.getElementById('tabContentInput').style.display = tab === 'input' ? 'block' : 'none';
      document.getElementById('tabContentSlide').style.display = tab === 'slide' ? 'block' : 'none';
      document.getElementById('tabInput').classList.toggle('active', tab === 'input');
      document.getElementById('tabSlide').classList.toggle('active', tab === 'slide');
      if (tab === 'slide') renderSlideshow();
    };

    // ── Slideshow ──
    function renderSlideshow() {
      const area = document.getElementById('slideshowArea');
      const dots = document.getElementById('progressDots');

      if (briefe.length === 0) {
        area.innerHTML = `<div class="empty-state"><div class="empty-icon">💌</div><p>Noch keine Briefe eingegeben.<br>Wechsel zum Tab "Satz eingeben"!</p></div>`;
        dots.innerHTML = '';
        document.getElementById('slideCounter').textContent = '0 / 0';
        return;
      }

      if (currentSlide >= briefe.length) currentSlide = briefe.length - 1;

      area.innerHTML = briefe.map((b, i) => `
        <div class="slide ${i === currentSlide ? 'active' : ''}" id="slide-${i}">
          <div class="slide-card">
            <div class="slide-icon">💌</div>
            <p class="slide-prefix">Du bist besser dran ohne ihn, weil...</p>
            <p class="slide-satz">${b.satz}</p>
            <p class="slide-name">— ${b.name}</p>
          </div>
        </div>
      `).join('');

      dots.innerHTML = briefe.map((_, i) =>
        `<div class="dot ${i === currentSlide ? 'active' : ''}" onclick="goToSlide(${i})"></div>`
      ).join('');

      updateSlideCounter();
    }

    function updateSlideCounter() {
      document.getElementById('slideCounter').textContent = (currentSlide + 1) + ' / ' + briefe.length;
    }

    window.goToSlide = function(idx) {
      document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
      currentSlide = idx;
      const s = document.getElementById('slide-' + idx);
      if (s) s.classList.add('active');
      const dotEls = document.querySelectorAll('.dot');
      if (dotEls[idx]) dotEls[idx].classList.add('active');
      updateSlideCounter();
    };

    window.nextSlide = function() {
      if (currentSlide < briefe.length - 1) goToSlide(currentSlide + 1);
    };

    window.prevSlide = function() {
      if (currentSlide > 0) goToSlide(currentSlide - 1);
    };
  </script>
</body>
</html>
